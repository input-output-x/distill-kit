[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "distillkit"
version = "0.1.0"
description = "把书/视频/文本蒸馏成结构化知识包（技能卡+索引+卡片+清单）"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["distillation", "knowledge", "skill", "llm", "agent", "prompt"]
dependencies = [
    "requests>=2.28",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
pdf = ["pypdf>=4.0"]
epub = ["ebooklib>=0.18", "beautifulsoup4>=4.12"]
all = ["pypdf>=4.0", "ebooklib>=0.18", "beautifulsoup4>=4.12"]

[project.scripts]
distill = "distillkit.cli:main"

[tool.setuptools.packages.find]
include = ["distillkit*"]
